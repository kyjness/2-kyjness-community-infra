# blueGreen의 active/preview Service — rollout.yaml과 세트.
apiVersion: v1
kind: Service
metadata:
  name: puppytalk-api-active
  labels:
    app.kubernetes.io/name: puppytalk-api
    app.kubernetes.io/component: active
spec:
  type: ClusterIP
  selector:
    app: puppytalk-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: puppytalk-api-preview
  labels:
    app.kubernetes.io/name: puppytalk-api
    app.kubernetes.io/component: preview
spec:
  type: ClusterIP
  selector:
    app: puppytalk-api
  ports:
    - name: http
      port: 80
      targetPort: http
