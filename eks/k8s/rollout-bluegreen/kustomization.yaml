# 블루/그린 변형 — base(Deployment) 대신 Rollout + active/preview Service.
# 적용: kubectl apply -k . (Argo Rollouts Controller 설치 후)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: puppytalk

resources:
  - rollout.yaml
  - services-rollout-bluegreen.yaml

images:
  - name: puppytalk-be
    newName: ghcr.io/kyjness/puppytalk-be
    newTag: latest
