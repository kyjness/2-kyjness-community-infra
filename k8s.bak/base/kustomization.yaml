# [Target 전용] 디렉터리가 k8s.bak 일 때: kubectl apply -k k8s.bak/overlays/prod-seoul
# -----------------------------------------------------------------------------
# Target(EKS) 기본: Deployment + Service + HPA (롤링).
# 블루/그린(Argo Rollouts)은 rollout.yaml.bak, services-rollout-bluegreen.yaml.bak 참고.
# -----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: puppytalk

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
