# -----------------------------------------------------------------------------
# 서울(ap-northeast-2) 프로덕션 오버레이 — 값은 terraform/ 리소스와 아래 표를 맞출 것.
#
# 기본 워크로드: Deployment + Service + HPA (롤링). 블루/그린(Target 전용)은
#   k8s/base/rollout.yaml.bak, services-rollout-bluegreen.yaml.bak,
#   patch-rollout-envfrom.json.bak 참고.
#
# | 항목 | Terraform 참조 | 비고 |
# |------|----------------|------|
# | 컨테이너 이미지 ECR | `aws_ecr_repository.be` | `terraform output -raw ecr_be_repository_url` |
# | DB 호스트(Current) | `aws_instance.db_server` | `db_server_private_ip` |
# | DB 호스트(Target RDS) | `enable_managed_rds=true` 시 | `terraform output -raw rds_address` |
# | Redis | ec2_db 동반 | `redis://<db_server_private_ip>:6379/0` |
# | S3 | `aws_s3_bucket.media` | 버킷명 프로젝트 규칙에 맞게 |
#
# 배포 전: kubectl create namespace puppytalk
# 적용:      kubectl apply -k k8s/overlays/prod-seoul
#
# Cluster Autoscaler: terraform output cluster_autoscaler_irsa_role_arn → Helm SA 주입
# metrics-server: HPA 전제 (EKS 애드온 등)
# -----------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: puppytalk

resources:
  - ../../base

configMapGenerator:
  - name: puppytalk-prod-seoul-env
    options:
      disableNameSuffixHash: true
    literals:
      - AWS_REGION=ap-northeast-2
      - STORAGE_BACKEND=s3
      - S3_BUCKET_NAME=puppytalk-media-bucket
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=puppytalk
      - DB_HOST=REPLACE_WITH_TERRAFORM_OUTPUT_db_server_private_ip
      - REDIS_URL=redis://REPLACE_WITH_TERRAFORM_OUTPUT_db_server_private_ip:6379/0

patches:
  - path: patch-deployment-envfrom.json
    target:
      kind: Deployment
      name: puppytalk-api

images:
  - name: puppytalk-be
    newName: 997784789037.dkr.ecr.ap-northeast-2.amazonaws.com/puppytalk-be
    newTag: latest
